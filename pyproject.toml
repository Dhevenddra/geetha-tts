[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geetha"
version = "0.1.0"
description = "Geetha v1 — open Tamil speech models: text normalisation, scoring, eval and GPU operations"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ops = ["pyyaml>=6.0", "requests>=2.32"]
# everything the unit tests import; found by running them in an empty environment on 17 Nov 2026
test = ["pytest>=8.0", "numpy>=1.26", "pyarrow>=15", "soundfile>=0.12", "pyyaml>=6.0", "requests>=2.32"]

[tool.setuptools.packages.find]
include = ["geetha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
