# Generated by scripts/make_probe_spec.py — regenerate rather than hand-edit,
# so the probe keeps using the same teardown code as the real wrapper.
checkpoint_repo: dhevenddra/geetha-ckpt
cloud_type: SECURE
command: "#!/usr/bin/env bash\n        set -u\n        echo \"[probe] pod=${RUNPOD_POD_ID:-<unset>} key_present=$([\
  \ -n \"${RUNPOD_API_KEY:-}\" ] && echo yes || echo no)\"\n        runpodctl version || echo \"[probe]\
  \ runpodctl not installed\"\n        echo \"[probe] sleeping 120s so the pod is observable from the\
  \ PC\"\n        sleep 120\n\n        geetha_self_destroy() {\n  echo \"[geetha] self-destroy: pod ${RUNPOD_POD_ID:-<unset>}\"\
  \n  geetha_push_log || true\n  runpodctl remove pod \"$RUNPOD_POD_ID\"\n  local rc_cli=$?\n  echo \"\
  [geetha] runpodctl remove exit=$rc_cli\"\n  if [ $rc_cli -ne 0 ]; then\n    curl -sS -X DELETE \\\n\
  \      -H \"Authorization: Bearer $RUNPOD_API_KEY\" \\\n      \"https://api.runpod.io/v2/pods/$RUNPOD_POD_ID\"\
  \n    echo \"[geetha] REST delete exit=$?\"\n  fi\n}\n\n        geetha_self_destroy\n        echo \"\
  [probe] if this line appears, the pod outlived its own delete call\"\n        sleep 600\n"
data_repos: []
disk_gb: 10
gate: M1
gpu_type: NVIDIA L4
image: runpod/pytorch:1.4.1-cu1290-torch280-ubuntu2204
max_cost_inr: 15.0
max_hours: 0.15
provider: runpod
run_id: m0-selfdelete-probe
wandb_project: geetha
